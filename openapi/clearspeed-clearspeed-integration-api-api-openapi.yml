      responses:
        '200':
          description: Result received
components:
  schemas:
    ResultWebhookRequest:
      type: object
      description: 'Clearspeed sends this JSON payload to your configured customer webhook URL

        when a result is published or updated.

        This is an incoming callback payload, not a Clearspeed endpoint request.

        '
      example:
        project_uuid: XXXXXXXX-ef1f-4d91-a2e2-7b33132b00f1
        callback_type: Result Update
        access_code: 7136XXXX59
        interview_ref_num: 456XXXX642
        status: Result Published
        questions_risk_rating:
        - sequence: '7'
          risk_level: LR
          text: 'Q7 '
        - sequence: '2'
          risk_level: HR
          text: 'Q2 '
        overall_evaluation: HR
        is_admission: false
        is_counter_measure: false
        is_not_complete: false
        participant_language: English
        summary: AR
        summary_bgcolor: '#dc3545'
        clear: true
      properties:
        project_uuid:
          type: string
        callback_type:
          type: string
        access_code:
          type: string
        interview_ref_num:
          type: string
        status:
          type: string
        questions_risk_rating:
          type: array
          items:
            type: object
            properties:
              sequence:
                type: string
              risk_level:
                type: string
              text:
                type: string
        overall_evaluation:
          type: string
        is_admission:
          type: boolean
        is_counter_measure:
          type: boolean
        is_not_complete:
          type: boolean
        participant_language:
          type: string
        summary:
          type: string
          description: Result summary label (for example, HR/LR/G/AR/NC)
        summary_bgcolor:
          type: string
          description: Hex color code associated with the summary label
          example: '#28a745'
        clear:
          type: boolean
          description: Whether result is clear
        timestamp:
          type: string
          format: date-time
  securitySchemes:
    authorization:
      type: apiKey
      in: header
      name: Authorization
