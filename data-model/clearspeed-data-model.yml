identifier_conventions:
- {field: participant_uuid, format: UUIDv7 observed in examples, prefix: none}
- {field: project_uuid, format: UUIDv4, prefix: none}
- {field: api_key, format: opaque string, prefix: 'cs_live_ appears in the OpenAPI
    example; the delete example uses a bare 64-character hex value, so the prefix is not
    guaranteed'}
- {field: interview_ref_num, format: customer-defined string, prefix: none, unique: true}
gaps:
- No list/read operations for any entity — the model is write-and-callback only.
- No GET for Participant, so participant_uuid can only be captured from the create response.
- No Result resource is addressable; results exist only as webhook deliveries.
- Questionnaire is named two different ways (questionnaire_id vs project_uuid).
