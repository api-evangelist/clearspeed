aid: clearspeed
name: Clearspeed
description: 'Clearspeed is a voice-based risk assessment company whose AI analyzes
  involuntary vocal characteristics — tone, cadence, hesitation and stress — in a subject''s
  spoken yes/no answers to produce an objective, language-independent risk indicator
  without requiring PII. Founded in 2016, it serves insurance claims and underwriting,
  government and defense vetting, financial services fraud and AML/KYC, plus hiring
  and vendor screening. Clearspeed exposes the Clearspeed Integration API, a REST
  contract on regional US and UK hosts that lets customers create participants against
  a questionnaire, track outcomes, and manage scoped API keys, with assessment results
  delivered back by webhook rather than polling.'
