apis:
- aid: clearspeed:integration-api
  name: Clearspeed Integration API
  description: 'REST API for embedding Clearspeed voice-based risk assessment into
    an existing system. Create participants against a questionnaire, update outcome
    tracking, and create or delete scoped API keys. Assessment results are delivered
    to a customer-configured webhook endpoint when a result is published or updated.
    Requests authenticate with a questionnaire-scoped API key in the Authorization
    header; regional US and UK production hosts are available.'
